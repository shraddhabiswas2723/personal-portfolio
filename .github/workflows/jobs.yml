name: Refresh live jobs

# Checks the job boards every 3 hours and commits jobs.json when openings change.
# Scheduled runs only happen on the default branch (main).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [claude/portfolio-role-matcher-710nn2]
    paths:
      - scripts/fetch-jobs.mjs
      - .github/workflows/jobs.yml
      - data.js

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch jobs
        id: fetch
        run: node scripts/fetch-jobs.mjs
      - name: Commit jobs.json
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "Refresh live jobs"
          git push
